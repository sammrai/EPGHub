# Local build override — use the source tree in this repo instead of the
# GHCR-published images. Layered on top of docker-compose.yml so the
# baseline (Postgres + volumes + ports) stays single-sourced.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yaml build
#   docker compose -f docker-compose.yml -f docker-compose.local.yaml up -d
#
# Separate project name (`epghub-local`) + distinct host port (:8891)
# so this stack runs alongside the production one (project `epghub`,
# :8890) without container or port collisions. Postgres / recordings
# live in their own named volumes; the TVDB cache is the only shared
# bit (host bind mount under ./data/tvdb-cache) so warm metadata is
# reused across both stacks.
#
# pull_policy: build forces compose to rebuild rather than fetch the
# `:local` tag from any registry; image: pins a stable tag so subsequent
# `up` calls don't trip over the absent registry copy.

name: epghub-local

services:
  server:
    image: epghub-server:local
    pull_policy: build

  app:
    image: epghub-app:local
    pull_policy: build
    # Distinct host port so a local build can run alongside the production
    # stack (which holds :8890). Internal container port stays :80 — nginx
    # inside the image still proxies /api → server:3000 on the compose net.
    ports: !override
      - "8891:80"
